edition = "2024";
package dogma.metrics.v1alpha1;

option go_package = "github.com/dogmatiq/protobuf/metricsgrpc";

import "github.com/dogmatiq/protobuf/uuidpb/uuid.proto";

// QueueSubject identifies one queue as the subject of a metric.
message QueueSubject {
  // QueueId is the ID of the queue.
  dogma.protobuf.v1.UUID queue_id = 1;
}

// HandlerSubject identifies one handler as the subject of a metric.
message HandlerSubject {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;
}

// EventStreamSubject identifies one event stream as the subject of a metric.
message EventStreamSubject {
  // EventStreamId is the ID of the event stream.
  dogma.protobuf.v1.UUID event_stream_id = 1;
}

// HandlerEventStreamSubject identifies one handler and one event stream as the
// subject of a metric.
message HandlerEventStreamSubject {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // EventStreamId is the ID of the event stream. It is required.
  dogma.protobuf.v1.UUID event_stream_id = 2;
}

// HandlerQueueSubject identifies one handler and one queue as the subject of a
// metric.
message HandlerQueueSubject {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // QueueId is the ID of the queue. It is absent when the subject is the
  // handler's instances that are not bound to any queue.
  dogma.protobuf.v1.UUID queue_id = 2;
}

// HandlerMessageTypeSubject identifies one handler and one message type as the
// subject of a metric.
message HandlerMessageTypeSubject {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // MessageTypeId is the ID of the message type, as the application in
  // WatchMetricsResponse.Preamble.application describes it. It is required.
  dogma.protobuf.v1.UUID message_type_id = 2;
}
