edition = "2024";
package dogma.metrics.v1alpha1;

option go_package = "github.com/dogmatiq/protobuf/metricsgrpc";

import "github.com/dogmatiq/protobuf/configpb/config.proto";
import "github.com/dogmatiq/protobuf/metricsgrpc/sample_eventstream.proto";
import "github.com/dogmatiq/protobuf/metricsgrpc/sample_handler.proto";
import "github.com/dogmatiq/protobuf/metricsgrpc/sample_queue.proto";
import "github.com/dogmatiq/protobuf/uuidpb/uuid.proto";

// MetricsAPI is a service that reports metrics about an engine, such as the
// number of messages waiting in queues.
//
// An engine may run as a cluster, which is a set of running instances of the
// engine that share the work of one application between them. Each instance is
// called a node, in that context.
service MetricsAPI {
  // WatchNodeMetrics reports metrics about the node that serves the call, such
  // as the number of messages waiting in the queues that it owns.
  //
  // An engine that runs as a single instance also serves this method, and
  // reports all of its metrics through it.
  //
  // If the engine runs as a cluster, the samples describe only the work that
  // the node owns, so a current count is only the node's own share. A
  // cumulative count is the number of occurrences on this node, so it keeps
  // growing when ownership of the work moves to another node. When the work
  // moves to another node, the node sends a tombstone for each current count of
  // that work.
  //
  // A client can add up the cumulative_count and current_count fields of one
  // subject from every node of the cluster to estimate the value for the whole
  // cluster. A node that sent a tombstone for a current count contributes zero
  // to the sum. The sum is an estimate because each node measures at a
  // different time.
  //
  // The other fields, such as watermark and gauge, describe one quantity that
  // several nodes can report, so adding them up can count it more than once.
  // The doc of each such field gives the rule for combining the values, if
  // there is one.
  //
  // If the engine can't measure a metric that the call reports, it fails the
  // call with the UNAVAILABLE status code.
  rpc WatchNodeMetrics(WatchNodeMetricsRequest)
      returns (stream WatchMetricsResponse);

  // WatchClusterMetrics reports metrics about the whole cluster, such as the
  // number of messages waiting in each of its queues.
  //
  // Any node of the cluster can serve the call, and its samples describe the
  // whole cluster. An engine that runs as a single instance fails the call with
  // the UNIMPLEMENTED status code.
  //
  // If the node can't measure a metric that the call reports, it fails the call
  // with the UNAVAILABLE status code. Another node of the cluster may still be
  // able to answer.
  rpc WatchClusterMetrics(WatchClusterMetricsRequest)
      returns (stream WatchMetricsResponse);
}

// WatchNodeMetricsRequest is the input to the MetricsAPI.WatchNodeMetrics
// method.
message WatchNodeMetricsRequest {}

// WatchClusterMetricsRequest is the input to the MetricsAPI.WatchClusterMetrics
// method.
message WatchClusterMetricsRequest {}

// WatchMetricsResponse is the (streaming) output of the
// MetricsAPI.WatchNodeMetrics and MetricsAPI.WatchClusterMetrics methods.
//
// The first message in the response contains a Preamble, which lists the
// metrics that the call reports.
//
// Subsequent messages in the response each contain a Sample, which reports one
// metric of one subject.
message WatchMetricsResponse {
  // Preamble identifies the engine that serves the call, and lists the metrics
  // that the call reports.
  message Preamble {
    // Id is the ID of the engine that serves the call. An engine has the same
    // ID in every API that it serves. Each engine has a different ID.
    //
    // If the engine runs as a cluster, the ID identifies the node that serves
    // the call, and each node of the cluster has a different ID.
    dogma.protobuf.v1.UUID id = 1;

    // ClusterId is the ID of the engine's cluster. It is present only if the
    // engine runs as a cluster. Nodes of the same cluster give the same cluster
    // ID, in every API that they serve.
    dogma.protobuf.v1.UUID cluster_id = 2;

    // Application describes the application that the engine runs, in the
    // version that it runs.
    dogma.config.v1alpha1.Application application = 3;

    // SupportedMetrics is the list of the metrics that this call reports. Each
    // entry is the full name of the Protocol Buffers message that holds the
    // metric's samples, such as "dogma.metrics.v1alpha1.QueueCommandsReady".
    // Each name appears once.
    repeated string supported_metrics = 4;
  }

  // Sample holds the value of one metric for one subject. A Sample whose value
  // is absent is a tombstone, which means that the engine has stopped reporting
  // that metric for that subject.
  //
  // A Sample replaces any earlier Sample of the same metric and subject on the
  // same response stream.
  //
  // The engine chooses how often it measures each metric. It sends a new Sample
  // each time it measures a value that differs from the last one that it sent
  // on the stream for the same metric and subject, including when the new value
  // is zero. A subject whose count falls to zero gets a zero or a tombstone,
  // depending on whether the engine keeps measuring it.
  //
  // Some metrics report a cumulative count, such as the number of events that a
  // handler has recorded since the engine started counting. The doc of each
  // says so. Within one response stream, the engine lowers a cumulative count
  // only by starting again from zero.
  message Sample {
    // Revision is a comparable value that describes when this sample was
    // measured, relative to other samples of the same metric and subject from
    // the same engine and method. The sample with the greatest revision is the
    // most recent, and replaces the others.
    //
    // Two revisions are compared in lexicographic order, as strings of unsigned
    // bytes. For example, an engine can use a timestamp, encoded as a
    // fixed-width big-endian integer.
    //
    // An engine should give the same revision to every sample from one
    // measurement.
    bytes revision = 1 [features.field_presence = IMPLICIT];

    // Metric identifies which metric the sample is for. Each case holds the
    // message of one metric, which holds the sample's subject and its value.
    // The engine always sets one case. A client that finds none of them set
    // ignores the Sample, because it is for a metric that the client does not
    // know.
    oneof metric {
      AggregateInstanceEventStreamBindings
                                   aggregate_instance_event_stream_bindings = 2;
      EventStreamLength            event_stream_length                      = 3;
      HandlerCommandsFailing       handler_commands_failing                 = 4;
      HandlerCommandsHandled       handler_commands_handled                 = 5;
      HandlerCommandsReady         handler_commands_ready                   = 6;
      HandlerDeadlinesCanceled     handler_deadlines_canceled               = 7;
      HandlerDeadlinesFailing      handler_deadlines_failing                = 8;
      HandlerDeadlinesHandled      handler_deadlines_handled                = 9;
      HandlerDeadlinesReady        handler_deadlines_ready         = 10;
      HandlerDeadlinesScheduled    handler_deadlines_scheduled     = 11;
      HandlerEventStreamLag        handler_event_stream_lag        = 12;
      HandlerEventStreamStaleness  handler_event_stream_staleness  = 13;
      HandlerEventsFailing         handler_events_failing          = 14;
      HandlerEventsHandled         handler_events_handled          = 15;
      HandlerEventsRecorded        handler_events_recorded         = 16;
      ProcessInstanceQueueBindings process_instance_queue_bindings = 17;
      ProcessInstancesEnded        process_instances_ended         = 18;
      QueueCommandsFailing         queue_commands_failing          = 19;
      QueueCommandsReady           queue_commands_ready            = 20;
      QueueCommandsRemoved         queue_commands_removed          = 21;
      QueueDeadlinesFailing        queue_deadlines_failing         = 22;
      QueueDeadlinesReady          queue_deadlines_ready           = 23;
      QueueDeadlinesRemoved        queue_deadlines_removed         = 24;
      QueueDeadlinesScheduled      queue_deadlines_scheduled       = 25;
    }
  }

  // Payload is the Preamble in the first response on a stream, and a Sample in
  // every other.
  oneof payload {
    Preamble preamble = 1;
    Sample   sample   = 2;
  }
}
