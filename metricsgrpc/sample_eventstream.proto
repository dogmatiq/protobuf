edition = "2024";
package dogma.metrics.v1alpha1;

option go_package = "github.com/dogmatiq/protobuf/metricsgrpc";

import "github.com/dogmatiq/protobuf/uuidpb/uuid.proto";

// EventStreamLength is the number of events on one event stream, which is an
// ordered sequence of events in which each event has an offset. The first
// event's offset is 0.
message EventStreamLength {
  // EventStreamId is the ID of the event stream.
  dogma.protobuf.v1.UUID event_stream_id = 1;

  // Watermark is the number of events on the stream, which is also the offset
  // at which the next event will be appended. It never decreases, so a client
  // that has seen a value knows that the stream has at least that many events.
  //
  // While ownership of the stream moves from one node to another, both may
  // report it. Both counts are positions on the same stream, so the value for
  // the whole cluster is the greatest value that any node reports.
  uint64 watermark = 2 [features.field_presence = IMPLICIT];
}

// AggregateInstanceEventStreamBindings is the number of an aggregate handler's
// instances that are bound to one event stream, which is the stream that their
// events are appended to.
//
// The number of the handler's instances is the total across the event streams.
message AggregateInstanceEventStreamBindings {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // EventStreamId is the ID of the event stream that the instances are bound
  // to. It is required.
  dogma.protobuf.v1.UUID event_stream_id = 2;

  // CurrentCount is the number of instances bound to the event stream.
  uint64 current_count = 3 [features.field_presence = IMPLICIT];
}

// HandlerEventStreamLag is the number of events on one event stream, of any
// type, that are after the offset that one handler has reached. The engine
// sends it only for process and projection handlers.
//
// A handler handles the events of some types and skips the rest. It has reached
// an offset when it has handled or skipped the event at that offset and every
// event before it.
//
// The stream may be one of another engine's event streams. The engine then
// counts the events that it knows are on the stream, which can be fewer than
// the stream has.
message HandlerEventStreamLag {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // EventStreamId is the ID of the event stream. It is required.
  dogma.protobuf.v1.UUID event_stream_id = 2;

  // Gauge is the number of events after the offset that the handler has
  // reached. It is zero when the handler has handled or skipped every event on
  // the stream.
  //
  // Several nodes can report the lag of one handler on one stream, so adding
  // their values counts the same events more than once.
  uint64 gauge = 3 [features.field_presence = IMPLICIT];
}
