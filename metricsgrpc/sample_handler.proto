edition = "2024";
package dogma.metrics.v1alpha1;

option go_package = "github.com/dogmatiq/protobuf/metricsgrpc";

import "google/protobuf/timestamp.proto";
import "github.com/dogmatiq/protobuf/metricsgrpc/interval.proto";
import "github.com/dogmatiq/protobuf/uuidpb/uuid.proto";

// AggregateInstancesInMemory is the number of an aggregate handler's instances
// that the engine holds in memory, so that it can handle commands for them
// without loading them from storage.
message AggregateInstancesInMemory {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of instances that the engine holds in memory.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// ProcessInstancesInMemory is the number of a process handler's instances that
// the engine holds in memory, so that it can handle events and deadlines for
// them without loading them from storage.
message ProcessInstancesInMemory {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of instances that the engine holds in memory.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerCommandsPending is the number of commands for one handler that are
// waiting to be delivered. The engine sends it only for aggregate and
// integration handlers.
message HandlerCommandsPending {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of commands.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerCommandsDue is the number of commands for one handler that are ready
// to be delivered now. The engine sends it only for aggregate and integration
// handlers.
message HandlerCommandsDue {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of commands that are ready.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerCommandsFailing is the number of commands for one handler that are
// waiting to be delivered and whose most recent delivery attempt failed. The
// engine sends it only for aggregate and integration handlers.
message HandlerCommandsFailing {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of failing commands.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerCommandsHandled is the running total of the commands that one handler
// has handled successfully. The engine sends it only for aggregate and
// integration handlers.
message HandlerCommandsHandled {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of commands that the handler has handled
  // successfully.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerDeadlinesPending is the number of deadlines for one handler that are
// waiting to be delivered. The engine sends it only for process handlers.
message HandlerDeadlinesPending {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of deadlines.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerDeadlinesDue is the number of deadlines for one handler that are ready
// to be delivered now. The engine sends it only for process handlers.
message HandlerDeadlinesDue {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of deadlines that are ready.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerDeadlinesFailing is the number of deadlines for one handler that are
// waiting to be delivered and whose most recent delivery attempt failed. The
// engine sends it only for process handlers.
message HandlerDeadlinesFailing {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of failing deadlines.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerDeadlinesHandled is the running total of the deadlines that one
// handler has handled successfully. The engine sends it only for process
// handlers.
message HandlerDeadlinesHandled {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of deadlines that the handler has handled
  // successfully.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerDeadlinesCanceled is the running total of the deadlines of one handler
// that were canceled before they were handled, such as when the process
// instance that scheduled them ended. The engine sends it only for process
// handlers.
message HandlerDeadlinesCanceled {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of deadlines that were canceled.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerEventsRecorded is the running total of the events that one handler has
// recorded. The engine sends it only for aggregate and integration handlers,
// and not for an integration handler that records no events.
message HandlerEventsRecorded {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of events that the handler has recorded.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerEventsHandled is the running total of the events that one handler has
// handled. The engine sends it only for process and projection handlers.
message HandlerEventsHandled {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of events that the handler has handled.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// HandlerEventsFailing is the number of events for one handler that haven't
// been handled yet and whose most recent delivery attempt failed. The engine
// sends it only for process and projection handlers.
message HandlerEventsFailing {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of failing events.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// ProcessInstancesEnded is the running total of the instances of one process
// handler that have ended.
message ProcessInstancesEnded {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of instances that have ended.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// ProjectionCompactionState describes the compactions of one projection
// handler: the compaction that is running now, the most recent compaction that
// ended, and the compaction that the engine plans to start next.
//
// ProjectionCompactionState describes one compaction at a time. An engine isn't
// expected to compact a handler more than once at a time, because the
// compactions would repeat each other's work. An engine that does so should not
// send ProjectionCompactionState.
message ProjectionCompactionState {
  // Running is a compaction that is running.
  message Running {
    // StartedAt is the time at which the compaction started, by the engine's
    // own clock. It is required.
    google.protobuf.Timestamp started_at = 1;
  }

  // Ended is a compaction that has ended.
  message Ended {
    // Success is the outcome of a compaction that the handler completed without
    // reporting an error.
    message Success {}

    // Error is the outcome of a compaction that stopped because the handler
    // reported an error.
    message Error {
      // Message is the text of the error, for a person to read.
      string message = 1 [features.field_presence = IMPLICIT];
    }

    // DeadlineExceeded is the outcome of a compaction that stopped because its
    // deadline passed.
    //
    // A handler is asked to compact in small steps, so that it makes some
    // progress even if the deadline passes. This outcome is therefore not a
    // failure.
    message DeadlineExceeded {}

    // Canceled is the outcome of a compaction that stopped because it was
    // canceled.
    //
    // This outcome is not a failure, because the compaction was stopped on
    // request.
    message Canceled {}

    // Outcome is how the compaction ended. It is required.
    oneof outcome {
      Success          success           = 1;
      Error            error             = 2;
      DeadlineExceeded deadline_exceeded = 3;
      Canceled         canceled          = 4;
    }

    // Interval is the time during which the compaction ran. It is absent if
    // the engine reports nothing about when the compaction ran.
    Interval interval = 5;
  }

  // Planned is a compaction that the engine plans to start.
  message Planned {
    // StartsAt is the time at which the engine plans to start the compaction,
    // by the engine's own clock.
    //
    // It is absent if the engine plans to start the compaction but can't tell
    // when.
    google.protobuf.Timestamp starts_at = 1;
  }

  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Current is the compaction that is running now. It is absent if none is
  // running.
  Running current = 2;

  // Previous is the most recent compaction that has ended. It is absent if none
  // has ended, or if the engine doesn't report it.
  Ended previous = 3;

  // Next is the compaction that the engine plans to start next. It is absent if
  // the engine doesn't plan to compact the handler again.
  Planned next = 4;
}

// ProjectionCompactionsCanceled is the running total of the compactions of one
// projection handler that have ended with the Canceled outcome.
//
// ProjectionCompactionState.Ended.canceled describes that outcome.
message ProjectionCompactionsCanceled {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of compactions that have ended with the Canceled
  // outcome.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// ProjectionCompactionsCompleted is the running total of the compactions of one
// projection handler that have ended with the Success outcome.
//
// ProjectionCompactionState.Ended.success describes that outcome.
message ProjectionCompactionsCompleted {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of compactions that have ended with the Success
  // outcome.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// ProjectionCompactionsDeadlineExceeded is the running total of the compactions
// of one projection handler that have ended with the DeadlineExceeded outcome.
//
// ProjectionCompactionState.Ended.deadline_exceeded describes that outcome.
message ProjectionCompactionsDeadlineExceeded {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of compactions that have ended with the
  // DeadlineExceeded outcome.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// ProjectionCompactionsFailed is the running total of the compactions of one
// projection handler that have ended with the Error outcome.
//
// ProjectionCompactionState.Ended.error describes that outcome.
message ProjectionCompactionsFailed {
  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Value is the number of compactions that have ended with the Error outcome.
  uint64 value = 2 [features.field_presence = IMPLICIT];
}

// ProjectionResetState describes the reset operations of one projection
// handler: the reset operation that is running now, the most recent reset
// operation that ended, and the reset operation that the engine plans to start
// next.
//
// A reset operation ends when the handler's Reset method returns, before the
// projection is rebuilt.
//
// ProjectionResetState describes one reset operation at a time. An engine that
// resets a handler more than once at a time should leave ProjectionResetState
// out.
message ProjectionResetState {
  // Running is a reset operation that is running.
  message Running {
    // StartedAt is the time at which the reset operation started, by the
    // engine's own clock. It is required.
    google.protobuf.Timestamp started_at = 1;
  }

  // Ended is a reset operation that has ended.
  message Ended {
    // Success is the outcome of a reset operation that the handler completed.
    message Success {}

    // Error is the outcome of a reset operation that stopped because the
    // handler reported an error.
    message Error {
      // Message is the text of the error, for a person to read.
      string message = 1 [features.field_presence = IMPLICIT];
    }

    // DeadlineExceeded is the outcome of a reset operation that stopped because
    // its deadline passed.
    message DeadlineExceeded {}

    // Canceled is the outcome of a reset operation that stopped because it was
    // canceled, for example because the engine is shutting down.
    message Canceled {}

    // Outcome is how the reset operation ended. It is required.
    oneof outcome {
      Success          success           = 1;
      Error            error             = 2;
      DeadlineExceeded deadline_exceeded = 3;
      Canceled         canceled          = 4;
    }

    // Interval is the time during which the reset operation ran. It is present
    // only if the engine reports when the reset operation ran.
    Interval interval = 5;
  }

  // Planned is a reset operation that the engine plans to start.
  message Planned {
    // StartsAt is the time at which the engine plans to start the reset
    // operation, by the engine's own clock. It is present only if the engine
    // can tell when.
    google.protobuf.Timestamp starts_at = 1;
  }

  // HandlerKey is the handler's identity key, as the application in
  // WatchMetricsResponse.Preamble.application describes it.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Current is the reset operation that is running now. It is present only
  // while a reset operation is running.
  Running current = 2;

  // Previous is the most recent reset operation that ended. It is present only
  // if a reset operation has ended and the engine reports it.
  Ended previous = 3;

  // Next is the reset operation that the engine plans to start next. It is
  // present only if the engine plans to reset the handler.
  Planned next = 4;
}
