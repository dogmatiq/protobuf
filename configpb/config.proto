edition = "2024";
package dogma.config.v1alpha1;

option go_package = "github.com/dogmatiq/protobuf/configpb";

import "github.com/dogmatiq/protobuf/identitypb/identity.proto";
import "github.com/dogmatiq/protobuf/uuidpb/uuid.proto";

// MessageKind is an enumeration of the kinds of message, represented by the
// [dogma.Command], [dogma.Event], and [dogma.Deadline] interfaces.
enum MessageKind {
  // MESSAGE_KIND_UNSPECIFIED is the zero-value. It is not a valid message kind.
  MESSAGE_KIND_UNSPECIFIED = 0;

  // MESSAGE_KIND_COMMAND is the kind of message that implements
  // [dogma.Command].
  MESSAGE_KIND_COMMAND = 1;

  // MESSAGE_KIND_EVENT is the kind of message that implements [dogma.Event].
  MESSAGE_KIND_EVENT = 2;

  // MESSAGE_KIND_DEADLINE is the kind of message that implements
  // [dogma.Deadline].
  MESSAGE_KIND_DEADLINE = 3;
}

// HandlerType is an enumeration of the types of handlers that an application
// can contain.
enum HandlerType {
  // HANDLER_TYPE_UNSPECIFIED is the zero-value. It is not a valid handler type.
  HANDLER_TYPE_UNSPECIFIED = 0;

  // HANDLER_TYPE_AGGREGATE is the type of handler that implements
  // [dogma.AggregateMessageHandler].
  HANDLER_TYPE_AGGREGATE = 1;

  // HANDLER_TYPE_PROCESS is the type of handler that implements
  // [dogma.ProcessMessageHandler].
  HANDLER_TYPE_PROCESS = 2;

  // HANDLER_TYPE_INTEGRATION is the type of handler that implements
  // [dogma.IntegrationMessageHandler].
  HANDLER_TYPE_INTEGRATION = 3;

  // HANDLER_TYPE_PROJECTION is the type of handler that implements
  // [dogma.ProjectionMessageHandler].
  HANDLER_TYPE_PROJECTION = 4;
}

// RouteType is an enumeration of the types of route that a handler can have. A
// route says how the handler uses messages of one type.
enum RouteType {
  // ROUTE_TYPE_UNSPECIFIED is the zero-value. It is not a valid route type.
  ROUTE_TYPE_UNSPECIFIED = 0;

  // ROUTE_TYPE_HANDLES_COMMAND is the type of route that a handler has for a
  // type of command that it handles.
  ROUTE_TYPE_HANDLES_COMMAND = 1;

  // ROUTE_TYPE_HANDLES_EVENT is the type of route that a handler has for a type
  // of event that it handles.
  ROUTE_TYPE_HANDLES_EVENT = 2;

  // ROUTE_TYPE_EXECUTES_COMMAND is the type of route that a handler has for a
  // type of command that it executes.
  ROUTE_TYPE_EXECUTES_COMMAND = 3;

  // ROUTE_TYPE_RECORDS_EVENT is the type of route that a handler has for a type
  // of event that it records.
  ROUTE_TYPE_RECORDS_EVENT = 4;

  // ROUTE_TYPE_SCHEDULES_DEADLINE is the type of route that a handler has for a
  // type of deadline that it schedules. The handler also handles each deadline
  // that it schedules.
  ROUTE_TYPE_SCHEDULES_DEADLINE = 5;
}

// ConcurrencyPreference is a hint to the engine as to the best way to handle
// concurrent messages for a message handler.
enum ConcurrencyPreference {
  // CONCURRENCY_PREFERENCE_UNSPECIFIED is the zero-value. It is not a valid
  // concurrency preference.
  CONCURRENCY_PREFERENCE_UNSPECIFIED = 0;

  // CONCURRENCY_PREFERENCE_MAXIMIZE instructs the engine to process as many
  // messages concurrently as possible, maximizing throughput.
  CONCURRENCY_PREFERENCE_MAXIMIZE = 1;

  // CONCURRENCY_PREFERENCE_MINIMIZE instructs the engine to attempt to process
  // messages one at a time, minimizing conflicts and/or contention.
  CONCURRENCY_PREFERENCE_MINIMIZE = 2;
}

// Application represents a Dogma application hosted by the engine on the
// server.
message Application {
  // Identity is the application's identity.
  dogma.protobuf.v1.Identity identity = 1;

  // Version is the version of the application, such as its release number or
  // the commit that it was built from. It is empty if the engine doesn't know
  // it.
  //
  // Its format is up to the application, so a client can tell whether two
  // versions are the same, but not which is newer.
  string version = 2 [features.field_presence = IMPLICIT];

  // GoType is the fully-qualified name of the Go type that provides the
  // application's implementation.
  string go_type = 3 [features.field_presence = IMPLICIT];

  // Handlers is the set of handlers within the application.
  repeated Handler handlers = 4;

  // MessageTypes is the set of message types that the application's handlers
  // produce or consume. Each message type appears once.
  repeated MessageType message_types = 5;
}

// Handler is a message handler within an application.
message Handler {
  // Identity is the handler's identity.
  dogma.protobuf.v1.Identity identity = 1;

  // GoType is the fully-qualified name of the Go type that provides the
  // handler's implementation.
  string go_type = 2 [features.field_presence = IMPLICIT];

  // Type is the handler's type.
  HandlerType type = 3 [features.field_presence = IMPLICIT];

  // Routes is the set of the handler's routes.
  repeated Route routes = 4;

  // IsDisabled indicates whether the handler is disabled.
  bool is_disabled = 5 [features.field_presence = IMPLICIT];

  // ConcurrencyPreference is a hint to the engine as to the best way to handle
  // concurrent messages for this handler.
  //
  // Only integration and projection handlers have a concurrency preference, and
  // the default is CONCURRENCY_PREFERENCE_MAXIMIZE. For the other types of
  // handler it is CONCURRENCY_PREFERENCE_UNSPECIFIED.
  ConcurrencyPreference concurrency_preference = 6
      [features.field_presence = IMPLICIT];

  // SupportsCompaction says whether the handler supports compaction, which
  // reduces the size of a projection by removing or consolidating its data.
  //
  // Only a projection handler can have it, and only if the engine knows whether
  // the handler supports compaction. It is absent if the engine doesn't know.
  bool supports_compaction = 7 [features.field_presence = EXPLICIT];

  // SupportsReset says whether the handler supports reset operations, which
  // delete all the data of a projection so that the handler builds it again.
  //
  // Only a projection handler can have it, and only if the engine knows whether
  // the handler supports reset operations. It is absent if the engine doesn't
  // know.
  bool supports_reset = 8 [features.field_presence = EXPLICIT];
}

// MessageType describes a type of message that an application's handlers
// produce or consume.
message MessageType {
  // Id is the unique identifier of the message type, as per the Dogma message
  // type registry. An envelope that holds a message of this type gives the same
  // ID in the type_id of its dogma.protobuf.v1.Message.
  dogma.protobuf.v1.UUID id = 1;

  // Name is the name of the message type without the package or module that
  // defines it, such as "OrderPlaced". Two message types can have the same
  // name.
  string name = 2 [features.field_presence = IMPLICIT];

  // QualifiedName is the name of the message type with the package or module
  // that defines it, such as "github.com/example/shop.OrderPlaced". Its format
  // depends on the programming language of the application.
  string qualified_name = 3 [features.field_presence = IMPLICIT];

  // Kind says whether messages of this type are commands, events or deadlines.
  MessageKind kind = 4 [features.field_presence = IMPLICIT];
}

// Route describes one of a handler's routes, which says how the handler uses
// messages of one type.
message Route {
  // MessageTypeId is the ID of the type of message that the route is for. It is
  // the id of one of the message types in Application.message_types.
  dogma.protobuf.v1.UUID message_type_id = 1;

  // RouteType says what the handler does with messages of that type, such as
  // handle commands or record events. The kind of message that the route type
  // names is the kind of the message type.
  RouteType route_type = 2 [features.field_presence = IMPLICIT];
}
