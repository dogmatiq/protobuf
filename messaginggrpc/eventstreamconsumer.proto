edition = "2024";
package dogma.messaging.v1;

option go_package = "github.com/dogmatiq/protobuf/messaginggrpc";

import "github.com/dogmatiq/protobuf/envelopepb/envelope.proto";
import "github.com/dogmatiq/protobuf/uuidpb/uuid.proto";

// EventStreamConsumerAPI is a service for consuming event messages from
// offset-based, ordered event streams.
service EventStreamConsumerAPI {
  // WatchEvents delivers matching events as they are appended to any event
  // stream offered by the server, for as long as the call is open. An event
  // matches if its message type ID is included in the request's list of message
  // type IDs, or if that list is empty.
  //
  // The feed starts at the tail of each stream. The first [EventStreamSegment]
  // the client receives for a stream tells the client that the stream exists
  // and the offset at which delivery begins. Each subsequent segment for that
  // stream MUST begin at the end offset of the previous segment.
  //
  // The server MUST send at least one segment for every stream it offers that
  // already contains matching events, even if the segment is empty, as it still
  // tells the client where delivery begins.
  //
  // If the server can no longer deliver a stream contiguously because the
  // client cannot keep up, it MUST close the call with RESOURCE_EXHAUSTED and
  // an attached [EventStreamConsumerTooSlow] value identifying the affected
  // stream. This can occur when events are appended faster than they can be
  // delivered to the client. See [EventStreamConsumerTooSlowError].
  rpc WatchEvents(WatchEventsRequest) returns (stream EventStreamSegment);

  // ReadEvents delivers matching events from a single event stream, in order,
  // beginning at the requested offset. An event matches if its message type ID
  // is included in the request's list of message type IDs, or if that list is
  // empty.
  //
  // Delivery ends when the server reaches the end of the stream, at which point
  // it closes the call.
  //
  // The first segment MUST begin at the requested offset. Each subsequent
  // segment MUST begin at the end offset of the previous segment.
  //
  // If the requested stream ID is not recognized, the server MUST return
  // NOT_FOUND with an attached [UnrecognizedEventStream] value. See
  // [UnrecognizedEventStreamError].
  //
  // If the requested offset is greater than the offset that the next event
  // appended to the stream will have, the server MUST return OUT_OF_RANGE.
  rpc ReadEvents(ReadEventsRequest) returns (stream EventStreamSegment);
}

// WatchEventsRequest is the input to the [EventStreamConsumerAPI.WatchEvents]
// method.
message WatchEventsRequest {
  // MessageTypeIds is the set of message type IDs of the event types to
  // include in the segments. An empty set matches every event.
  repeated dogma.protobuf.v1.UUID message_type_ids = 1;
}

// ReadEventsRequest is the input to the [EventStreamConsumerAPI.ReadEvents]
// method.
message ReadEventsRequest {
  // EventStreamId is the ID of the stream from which events are read.
  dogma.protobuf.v1.UUID event_stream_id = 1;

  // BeginOffset is the offset from which events are read. The first segment
  // begins at this offset. Events from this offset to the end of the stream
  // are delivered, then the call is closed.
  uint64 begin_offset = 2 [features.field_presence = IMPLICIT];

  // MessageTypeIds is the set of message type IDs of the event types to
  // include in the segments. An empty set matches every event.
  repeated dogma.protobuf.v1.UUID message_type_ids = 3;
}

// EventStreamSegment is a contiguous piece of one event stream, the half-open
// range [begin_offset, end_offset). It carries the events in that range that
// match the requested message types.
//
// It is the (streaming) output of both [EventStreamConsumerAPI.WatchEvents]
// and [EventStreamConsumerAPI.ReadEvents].
message EventStreamSegment {
  // EventStreamId is the ID of the stream that this is a segment of.
  dogma.protobuf.v1.UUID event_stream_id = 1;

  // BeginOffset is the offset of the first event in the range, inclusive.
  //
  // Each segment after the first for a stream begins at the end offset of the
  // one before it.
  uint64 begin_offset = 2 [features.field_presence = IMPLICIT];

  // EndOffset is the offset immediately after the range, exclusive.
  uint64 end_offset = 3 [features.field_presence = IMPLICIT];

  // Envelopes is a (possibly empty) list of multi-envelopes containing the
  // events in the range that match the requested message types.
  //
  // Each envelope includes the [envelopepb.EventStreamPosition] extension.
  //
  // The events appear in ascending offset order, both within each
  // multi-envelope and across the list. Their offsets may have gaps, because
  // events of other types are omitted. There is no additional relationship
  // implied between envelopes that appear in the same segment.
  repeated dogma.protobuf.v1.MultiEnvelope envelopes = 4;
}
