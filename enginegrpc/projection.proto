edition = "2024";
package dogma.engine.v1alpha1;

option go_package = "github.com/dogmatiq/protobuf/enginegrpc";

import "google/protobuf/timestamp.proto";
import "github.com/dogmatiq/protobuf/uuidpb/uuid.proto";

// ProjectionAPI is a service that lets a client inspect and manage the
// projections of an engine.
//
// A projection is the data that a projection handler builds from the events of
// an application.
//
// An engine may run as a cluster, which is a set of running instances of the
// engine that share the work of one application between them. Each instance is
// called a node, in that context.
service ProjectionAPI {
  // StartCompaction asks the engine to compact a projection handler, which
  // reduces the size of its projection by removing or consolidating data.
  //
  // A successful call means only that the engine has accepted the request. The
  // engine decides whether to start a compaction. For example, it may let the
  // compaction that is already running finish instead of starting another.
  //
  // If the engine runs as a cluster, the node that serves the call passes the
  // request to the node that does the work, or fails the call with UNAVAILABLE.
  //
  // An identity key that is missing or invalid, or that belongs to a handler of
  // another type, results in INVALID_ARGUMENT. An unknown identity key results
  // in NOT_FOUND. A handler that is disabled, or that the engine knows doesn't
  // support compaction, results in FAILED_PRECONDITION.
  rpc StartCompaction(StartCompactionRequest) returns (StartCompactionResponse);

  // CancelCompaction asks the engine to cancel the compaction of a projection
  // handler that is running now.
  //
  // A successful call means only that the engine has accepted the request. The
  // call succeeds whether the handler's compaction is running or ended.
  //
  // The handler keeps the progress that the compaction made. The engine may
  // start a later compaction.
  //
  // It fails in the same ways as StartCompaction.
  rpc CancelCompaction(CancelCompactionRequest)
      returns (CancelCompactionResponse);

  // GetCompactions reports what the node that serves the call knows about the
  // compactions of one projection handler.
  //
  // An identity key that is missing or invalid, or that belongs to a handler of
  // another type, results in INVALID_ARGUMENT. An unknown identity key results
  // in NOT_FOUND. A handler that is disabled, or that the engine knows doesn't
  // support compaction, results in FAILED_PRECONDITION.
  rpc GetCompactions(GetCompactionsRequest) returns (GetCompactionsResponse);

  // Reset asks the engine to reset a projection handler, which deletes all the
  // data of its projection, so that the projection is rebuilt from all the
  // events of the application.
  //
  // A successful call means only that the engine has accepted the request. The
  // reset operation may still fail afterwards, for example if the handler
  // returns an error.
  //
  // If the engine runs as a cluster, the node that serves the call passes the
  // request to the node that does the work, or fails the call with UNAVAILABLE.
  //
  // An identity key that is missing or invalid, or that belongs to a handler of
  // another type, results in INVALID_ARGUMENT. An unknown identity key results
  // in NOT_FOUND. A handler that is disabled, or that the engine knows doesn't
  // support reset operations, results in FAILED_PRECONDITION.
  rpc Reset(ResetRequest) returns (ResetResponse);
}

// StartCompactionRequest is the input to the ProjectionAPI.StartCompaction
// method.
message StartCompactionRequest {
  // HandlerKey is the handler's identity key. It is required.
  dogma.protobuf.v1.UUID handler_key = 1;
}

// StartCompactionResponse is the output of the ProjectionAPI.StartCompaction
// method.
message StartCompactionResponse {}

// CancelCompactionRequest is the input to the ProjectionAPI.CancelCompaction
// method.
message CancelCompactionRequest {
  // HandlerKey is the handler's identity key. It is required.
  dogma.protobuf.v1.UUID handler_key = 1;
}

// CancelCompactionResponse is the output of the ProjectionAPI.CancelCompaction
// method.
message CancelCompactionResponse {}

// GetCompactionsRequest is the input to the ProjectionAPI.GetCompactions
// method.
message GetCompactionsRequest {
  // HandlerKey is the handler's identity key. It is required.
  dogma.protobuf.v1.UUID handler_key = 1;
}

// GetCompactionsResponse is the output of the ProjectionAPI.GetCompactions
// method.
message GetCompactionsResponse {
  // Running is a compaction that is running.
  message Running {
    // StartedAt is the time at which the compaction started, by the engine's
    // own clock. It is required.
    google.protobuf.Timestamp started_at = 1;
  }

  // Ended is a compaction that has ended.
  message Ended {
    // Outcome is how the compaction ended. It is required.
    ProjectionCompactionOutcome outcome = 1;

    // StartedAt is the time at which the compaction started, by the clock of
    // the engine that ran it. It is present only if the engine that sends this
    // message knows that time.
    google.protobuf.Timestamp started_at = 2;

    // EndedAt is the time at which the compaction ended, by the same clock. It
    // is present only if the engine that sends this message knows that time.
    google.protobuf.Timestamp ended_at = 3;
  }

  // Planned is a compaction that a node plans to start.
  message Planned {
    // StartsAt is the time at which the node plans to start the compaction, by
    // its own clock. It is present only if the node can tell when.
    google.protobuf.Timestamp starts_at = 1;
  }

  // Current is the compaction that the node that serves the call is running
  // now. It is present only while that node is compacting the handler, and only
  // if the engine reports the compactions that it runs.
  Running current = 1;

  // Previous is the most recent ended compaction that the node that serves the
  // call knows of. Another node of the cluster may have run it. It is present
  // only if the node that serves the call knows of an ended compaction.
  Ended previous = 2;

  // Next is the compaction that the node that serves the call plans to start
  // next. It is present only if that node plans to compact the handler.
  Planned next = 3;
}

// ResetRequest is the input to the ProjectionAPI.Reset method.
message ResetRequest {
  // HandlerKey is the handler's identity key. It is required.
  dogma.protobuf.v1.UUID handler_key = 1;
}

// ResetResponse is the output of the ProjectionAPI.Reset method.
message ResetResponse {}

// ProjectionCompactionStarted reports that an engine has started a compaction
// of one projection handler.
//
// At the start of a WatchEngine response stream, the engine sends one for each
// compaction that it is already running. A node of a cluster sends it for each
// compaction that it runs.
message ProjectionCompactionStarted {
  // HandlerKey is the identity key of the handler that the engine is
  // compacting. It is required.
  dogma.protobuf.v1.UUID handler_key = 1;

  // StartedAt is the time at which the compaction started, by the engine's own
  // clock. It is required.
  google.protobuf.Timestamp started_at = 2;
}

// ProjectionCompactionEnded reports that a compaction that an engine was
// running has ended.
message ProjectionCompactionEnded {
  // HandlerKey is the identity key of the handler that the engine was
  // compacting. It is required.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Outcome is how the compaction ended. It is required.
  ProjectionCompactionOutcome outcome = 2;

  // EndedAt is the time at which the compaction ended, by the engine's own
  // clock. It is required.
  google.protobuf.Timestamp ended_at = 3;
}

// ProjectionCompactionOutcome describes how a compaction of a projection
// handler ended.
message ProjectionCompactionOutcome {
  // Success is the outcome of a compaction that the handler completed.
  message Success {}

  // Error is the outcome of a compaction that stopped because the handler
  // reported an error.
  message Error {
    // Message is the text of the error, for a person to read.
    string message = 1 [features.field_presence = IMPLICIT];
  }

  // DeadlineExceeded is the outcome of a compaction that stopped because its
  // deadline passed.
  //
  // A handler is asked to compact in small steps, so that it makes some
  // progress even if the deadline passes.
  message DeadlineExceeded {}

  // Canceled is the outcome of a compaction that stopped because it was
  // canceled, for example by a call to ProjectionAPI.CancelCompaction.
  message Canceled {}

  // Outcome is how the compaction ended. It is required.
  oneof outcome {
    Success          success           = 1;
    Error            error             = 2;
    DeadlineExceeded deadline_exceeded = 3;
    Canceled         canceled          = 4;
  }
}

// ProjectionResetStarted reports that an engine has started a reset operation
// of one projection handler.
//
// At the start of a WatchEngine response stream, the engine sends one for each
// reset operation that it is already running. A node of a cluster sends it for
// each reset operation that it runs.
message ProjectionResetStarted {
  // HandlerKey is the identity key of the handler that the engine is resetting.
  // It is required.
  dogma.protobuf.v1.UUID handler_key = 1;

  // StartedAt is the time at which the reset operation started, by the engine's
  // own clock. It is required.
  google.protobuf.Timestamp started_at = 2;
}

// ProjectionResetEnded reports that a reset operation that an engine was
// running has ended. A reset operation ends when the handler's Reset method
// returns, before the projection is rebuilt.
message ProjectionResetEnded {
  // HandlerKey is the identity key of the handler that the engine was
  // resetting. It is required.
  dogma.protobuf.v1.UUID handler_key = 1;

  // Outcome is how the reset operation ended. It is required.
  ProjectionResetOutcome outcome = 2;

  // EndedAt is the time at which the reset operation ended, by the engine's own
  // clock. It is required.
  google.protobuf.Timestamp ended_at = 3;
}

// ProjectionResetOutcome describes how a reset operation of a projection
// handler ended.
message ProjectionResetOutcome {
  // Success is the outcome of a reset operation that the handler completed.
  message Success {}

  // Error is the outcome of a reset operation that stopped because the handler
  // reported an error.
  message Error {
    // Message is the text of the error, for a person to read.
    string message = 1 [features.field_presence = IMPLICIT];
  }

  // DeadlineExceeded is the outcome of a reset operation that stopped because
  // its deadline passed.
  message DeadlineExceeded {}

  // Canceled is the outcome of a reset operation that stopped because it was
  // canceled, for example because the engine is shutting down.
  message Canceled {}

  // Outcome is how the reset operation ended. It is required.
  oneof outcome {
    Success          success           = 1;
    Error            error             = 2;
    DeadlineExceeded deadline_exceeded = 3;
    Canceled         canceled          = 4;
  }
}
